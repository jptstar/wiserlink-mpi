name: Release

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/wiserlink_mpi/manifest.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish release from manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r '.version' custom_components/wiserlink_mpi/manifest.json)"
          TAG="v${VERSION}"

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Unable to read integration version from manifest.json"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
